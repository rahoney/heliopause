name: Heliopause CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      pytorch_cuda_qualification:
        description: Run the bounded cu126 full qualification after disk/resource preflight.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: .

concurrency:
  group: heliopause-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Quick
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Quick profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check quick

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Run canonical Docs profile
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check docs

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Security profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check security

  vulnerability:
    name: Vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Vulnerability profile
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check vulnerability

  minimum-go:
    name: Minimum Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: false
      - name: Bootstrap product modules
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
        run: go run ./scripts/check bootstrap-modules
      - name: Run canonical platform profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
        run: go run ./scripts/check platform

  macos:
    name: macOS
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Bootstrap product modules
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
        run: go run ./scripts/check bootstrap-modules
      - name: Run canonical platform profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
        run: go run ./scripts/check platform

  gvisor-observer:
    name: gVisor Observer Helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build exact gVisor observer helper with Bazel
        run: |
          set -eu
          runtime_lock=scripts/runtimes.lock.json
          test -f "$runtime_lock"
          gvisor_repository="$(jq -er '.gvisor.source_repository' "$runtime_lock")"
          gvisor_commit="$(jq -er '.gvisor.commit' "$runtime_lock")"
          bazel_url="$(jq -er '.bazel.linux_x86_64_url' "$runtime_lock")"
          bazel_sha512="$(jq -er '.bazel.linux_x86_64_sha512' "$runtime_lock")"
          git clone --filter=blob:none "$gvisor_repository" "$RUNNER_TEMP/gvisor"
          git -C "$RUNNER_TEMP/gvisor" checkout --detach "$gvisor_commit"
          test "$(git -C "$RUNNER_TEMP/gvisor" rev-parse HEAD)" = "$gvisor_commit"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/bazel" "$bazel_url"
          test "$(sha512sum "$RUNNER_TEMP/bazel" | awk '{print $1}')" = "$bazel_sha512"
          chmod 0755 "$RUNNER_TEMP/bazel"
          cp -R tools/gvisor-observer "$RUNNER_TEMP/gvisor/tools/haa_gvisor_observer"
          cd "$RUNNER_TEMP/gvisor"
          "$RUNNER_TEMP/bazel" build -c opt //tools/haa_gvisor_observer:haa_gvisor_observer //tools/haa_gvisor_observer:haa_gvisor_observer_latch_test
          bazel-bin/tools/haa_gvisor_observer/haa_gvisor_observer_latch_test

  gvisor-integration:
    name: gVisor Linux Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Install pinned runtime and run lifecycle integration
        run: |
          set -eu
          runtime_lock=scripts/runtimes.lock.json
          test -f "$runtime_lock"
          docker_package_version="$(jq -er '.docker.ci_ubuntu_24_04_amd64.docker_ce_package' "$runtime_lock")"
          containerd_package_version="$(jq -er '.docker.ci_ubuntu_24_04_amd64.containerd_package' "$runtime_lock")"
          docker_engine_version="$(jq -er '.docker.ci_engine_version' "$runtime_lock")"
          gvisor_repository="$(jq -er '.gvisor.source_repository' "$runtime_lock")"
          gvisor_commit="$(jq -er '.gvisor.commit' "$runtime_lock")"
          runsc_url="$(jq -er '.gvisor.binaries.x86_64.url' "$runtime_lock")"
          runsc_sha512="$(jq -er '.gvisor.binaries.x86_64.sha512' "$runtime_lock")"
          bazel_url="$(jq -er '.bazel.linux_x86_64_url' "$runtime_lock")"
          bazel_sha512="$(jq -er '.bazel.linux_x86_64_sha512' "$runtime_lock")"
          node_image="$(jq -er '.node_image.reference' "$runtime_lock")"
          python_image="$(jq -er '.python_image.reference' "$runtime_lock")"
          conflicting_packages=()
          for package in docker.io docker-compose docker-compose-v2 docker-doc podman-docker containerd runc moby-engine moby-cli; do
            if dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii'; then
              conflicting_packages+=("$package")
            fi
          done
          if ((${#conflicting_packages[@]})); then
            sudo apt-get remove -y "${conflicting_packages[@]}"
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --location --silent --show-error https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://download.docker.com/linux/ubuntu' \
            'Suites: noble' \
            'Components: stable' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/docker.asc' | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "docker-ce=$docker_package_version" \
            "docker-ce-cli=$docker_package_version" \
            "containerd.io=$containerd_package_version"
          test "$(docker version --format '{{.Server.Version}}')" = "$docker_engine_version"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/runsc" "$runsc_url"
          test "$(sha512sum "$RUNNER_TEMP/runsc" | awk '{print $1}')" = "$runsc_sha512"
          chmod 0755 "$RUNNER_TEMP/runsc"
          sudo install -d -m 0755 /usr/libexec/heliopause
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/libexec/heliopause/runsc
          sudo install -d -m 0700 -o "$USER" -g "$(id -gn)" /run/heliopause-observer
          sudo install -d -m 0755 /etc/heliopause
          sudo install -m 0600 tools/gvisor-observer/pod-init.json /etc/heliopause/pod-init.json
          sudo /usr/libexec/heliopause/runsc install --runtime=runsc-trace -- --pod-init-config=/etc/heliopause/pod-init.json
          sudo python3 -c 'import json; from pathlib import Path; path = Path("/etc/docker/daemon.json"); config = json.loads(path.read_text()) if path.exists() else {}; config.update({"firewall-backend": "iptables", "iptables": True, "ip6tables": False}); path.write_text(json.dumps(config, sort_keys=True) + "\n")'
          sudo systemctl restart docker || { sudo systemctl status docker --no-pager || true; sudo journalctl -u docker --no-pager -n 100 || true; exit 1; }
          sudo iptables -S DOCKER-USER
          docker pull "$node_image"
          docker pull "$python_image"
          git clone --filter=blob:none "$gvisor_repository" "$RUNNER_TEMP/gvisor"
          git -C "$RUNNER_TEMP/gvisor" checkout --detach "$gvisor_commit"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/bazel" "$bazel_url"
          test "$(sha512sum "$RUNNER_TEMP/bazel" | awk '{print $1}')" = "$bazel_sha512"
          chmod 0755 "$RUNNER_TEMP/bazel"
          cp -R tools/gvisor-observer "$RUNNER_TEMP/gvisor/tools/haa_gvisor_observer"
          cd "$RUNNER_TEMP/gvisor"
          "$RUNNER_TEMP/bazel" build -c opt //tools/haa_gvisor_observer:haa_gvisor_observer
          cd "$GITHUB_WORKSPACE"
          sudo install -m 0755 "$RUNNER_TEMP/gvisor/bazel-bin/tools/haa_gvisor_observer/haa_gvisor_observer" /usr/libexec/heliopause/haa_gvisor_observer

          go build -trimpath -o "$RUNNER_TEMP/helox" ./cmd/helox
          go build -trimpath -o "$RUNNER_TEMP/haa-network-policy-helper" ./cmd/haa-network-policy-helper
          sudo install -m 0755 "$RUNNER_TEMP/helox" /usr/libexec/heliopause/helox
          sudo install -m 0755 "$RUNNER_TEMP/haa-network-policy-helper" /usr/libexec/heliopause/haa-network-policy-helper
          sudo install -d -m 0755 -o root -g root /run/heliopause-network-policy
          printf '{"socket_path":"/run/heliopause-network-policy/helper.sock","client_path":"/usr/libexec/heliopause/helox","client_uid":%s,"client_gid":%s}\n' "$(id -u)" "$(id -g)" | sudo tee /etc/heliopause/network-policy.json >/dev/null
          # The ordinary client must read the root-owned, non-writable public
          # identity contract; it contains no credential or secret.
          sudo chmod 0644 /etc/heliopause/network-policy.json
          sudo /usr/libexec/heliopause/haa-network-policy-helper >/tmp/haa-network-policy-helper.log 2>&1 &
          policy_helper_pid=$!
          trap 'sudo kill "$policy_helper_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            test -S /run/heliopause-network-policy/helper.sock && break
            sleep 0.1
          done
          test -S /run/heliopause-network-policy/helper.sock
          /usr/libexec/heliopause/runsc --version
          docker version --format '{{.Server.Version}}'
          docker info --format '{{json (index .Runtimes "runsc-trace")}}'
          go test -run='^$' -fuzz=FuzzDecodeHelperRecord -fuzztime=2s ./internal/sandbox
          HELOX_HOSTTOOL_INTEGRATION=1 go test -v -timeout=2m ./internal/hosttool -run TestLinuxTrustedHostExecutorIntegration
          HELOX_GVISOR_INTEGRATION=1 go test -timeout=5m ./internal/sandbox -run TestLinuxGVisorLifecycleIntegration
          HELOX_GITHUB_RELEASE_INTEGRATION=1 go test -timeout=5m ./internal/sandbox -run TestLinuxGitHubReleaseELFDynamicIntegration
          # M4/M5 intentionally return 10 for a completed inspection whose
          # policy decision is MANUAL_REVIEW. This proves the ordinary-user
          # typed-helper path ran without treating an unpromoted package as a
          # successful installation.
          set +e
          /usr/libexec/heliopause/helox npm install is-number@7.0.0 --target "$RUNNER_TEMP/npm-target"
          npm_status=$?
          /usr/libexec/heliopause/helox pip install packaging@25.0 --target "$RUNNER_TEMP/pypi-target"
          pypi_status=$?
          set -e
          test "$npm_status" = 10
          test "$pypi_status" = 10
          HELOX_PYTORCH_RESOLVER_INTEGRATION=1 go test -v -timeout=10m ./internal/sandbox -run TestLinuxPyTorchResolverIntegration
          HELOX_PYTORCH_FULL_INTEGRATION=1 HELOX_PYTORCH_PROFILE=cpu go test -v -timeout=20m ./internal/bootstrap -run TestLinuxPyTorchFullIntegration
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pytorch_cuda_qualification }}" = true ]; then
            HELOX_PYTORCH_FULL_INTEGRATION=1 HELOX_PYTORCH_PROFILE=cu126 go test -v -timeout=45m ./internal/bootstrap -run TestLinuxPyTorchFullIntegration
          fi
          HELOX_PYPI_DYNAMIC_INTEGRATION=1 go test -v -timeout=5m ./internal/sandbox -run 'TestLinuxPyPI(WheelDynamic|SdistBuild)Integration'
          HELOX_PROMOTION_INTEGRATION=1 go test -v -timeout=5m ./internal/promotion -run TestLinuxNPMPromotionIntegration
          HELOX_PYPI_PROMOTION_INTEGRATION=1 go test -v -timeout=5m ./internal/promotion -run TestLinuxPyPIPromotionIntegration

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quick
      - docs
      - security
      - vulnerability
      - minimum-go
      - macos
      - gvisor-observer
      - gvisor-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      QUICK_RESULT: ${{ needs.quick.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
      MINIMUM_GO_RESULT: ${{ needs.minimum-go.result }}
      MACOS_RESULT: ${{ needs.macos.result }}
      GVISOR_OBSERVER_RESULT: ${{ needs.gvisor-observer.result }}
      GVISOR_INTEGRATION_RESULT: ${{ needs.gvisor-integration.result }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Aggregate required job results
        run: go run ./scripts/check required "$QUICK_RESULT" "$DOCS_RESULT" "$SECURITY_RESULT" "$VULNERABILITY_RESULT" "$MINIMUM_GO_RESULT" "$MACOS_RESULT" "$GVISOR_OBSERVER_RESULT" "$GVISOR_INTEGRATION_RESULT"
