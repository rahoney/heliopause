name: Heliopause CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

concurrency:
  group: heliopause-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Quick
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Quick profile offline
        run: go run ./scripts/check quick

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Run canonical Docs profile
        run: go run ./scripts/check docs

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quick
      - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      QUICK_RESULT: ${{ needs.quick.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Aggregate required job results
        run: go run ./scripts/check required "$QUICK_RESULT" "$DOCS_RESULT"
