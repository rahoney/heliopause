name: Heliopause CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      pytorch_cu126_qualification:
        description: Run only the bounded cu126 full qualification.
        required: false
        default: false
        type: boolean
      pytorch_cu130_qualification:
        description: Run only the bounded cu130 full qualification.
        required: false
        default: false
        type: boolean
      pytorch_cu132_qualification:
        description: Run only the bounded cu132 full qualification.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: .

concurrency:
  group: heliopause-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel-corpus:
    name: Representative Wheel Corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Prepare pinned module dependencies
        run: go run ./scripts/check bootstrap-modules
      - name: Acquire authenticated representative wheels as data
        env:
          HELOX_CORPUS_ROOT: ${{ runner.temp }}/wheel-corpus
        run: python3 scripts/prepare-wheel-corpus.py --root "$HELOX_CORPUS_ROOT"
      - name: Validate representative corpus offline
        env:
          HELOX_CORPUS_ROOT: ${{ runner.temp }}/wheel-corpus
        run: go run ./scripts/check corpus


  quick:
    name: Quick
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Quick profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check quick

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Run canonical Docs profile
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check docs

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Security profile offline
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check security

  vulnerability:
    name: Vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Bootstrap pinned dependencies and tools
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check bootstrap
      - name: Run canonical Vulnerability profile
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-quality-tools
        run: go run ./scripts/check vulnerability

  minimum-go:
    name: Minimum Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Bootstrap product modules
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
          GOCACHE: ${{ runner.temp }}/heliopause-platform-tools/go-build
          GOFLAGS: ''
        run: go run -trimpath ./scripts/check bootstrap-modules
      - name: Run canonical platform profile offline
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
          GOCACHE: ${{ runner.temp }}/heliopause-platform-tools/go-build
          GOFLAGS: ''
        run: go run -trimpath ./scripts/check platform

  macos:
    name: macOS
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Bootstrap product modules
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
          GOCACHE: ${{ runner.temp }}/heliopause-platform-tools/go-build
          GOFLAGS: ''
        run: go run -trimpath ./scripts/check bootstrap-modules
      - name: Run canonical platform profile offline
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          HELOX_TOOL_CACHE: ${{ runner.temp }}/heliopause-platform-tools
          GOCACHE: ${{ runner.temp }}/heliopause-platform-tools/go-build
          GOFLAGS: ''
        run: go run -trimpath ./scripts/check platform

  gvisor-observer:
    name: gVisor Observer Helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build exact gVisor observer helper with Bazel
        run: scripts/build-gvisor-observer-release.sh "$RUNNER_TEMP/haa_gvisor_observer"

  gvisor-integration:
    name: gVisor Linux Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GOTOOLCHAIN: local
      HELOX_CI_CUDA_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.pytorch_cu126_qualification || inputs.pytorch_cu130_qualification || inputs.pytorch_cu132_qualification) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Install pinned runtime and run lifecycle integration
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        run: |
          set -eu
          runtime_lock=scripts/runtimes.lock.json
          test -f "$runtime_lock"
          docker_package_version="$(jq -er '.docker.ci_ubuntu_24_04_amd64.docker_ce_package' "$runtime_lock")"
          containerd_package_version="$(jq -er '.docker.ci_ubuntu_24_04_amd64.containerd_package' "$runtime_lock")"
          docker_engine_version="$(jq -er '.docker.ci_engine_version' "$runtime_lock")"
          node_image="$(jq -er '.node_image.reference' "$runtime_lock")"
          python_image="$(jq -er '.python_image.reference' "$runtime_lock")"
          go_image="$(jq -er '.go_image.reference' "$runtime_lock")"
          rust_image="$(jq -er '.rust_image.reference' "$runtime_lock")"
          uv_image="$(jq -er '.uv_image.reference' "$runtime_lock")"
          # The hosted runner's Azure mirror can stall before runtime setup.
          # Keep Ubuntu's signed sources; use its official HTTPS archive directly.
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          conflicting_packages=()
          for package in docker.io docker-compose docker-compose-v2 docker-doc podman-docker containerd runc moby-engine moby-cli; do
            if dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^ii'; then
              conflicting_packages+=("$package")
            fi
          done
          if ((${#conflicting_packages[@]})); then
            sudo apt-get remove -y "${conflicting_packages[@]}"
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --location --silent --show-error https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://download.docker.com/linux/ubuntu' \
            'Suites: noble' \
            'Components: stable' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/docker.asc' | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
          sudo timeout --kill-after=30s 10m apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=30s 15m apt-get "${apt_options[@]}" install -y --allow-downgrades --no-install-recommends \
            "docker-ce=$docker_package_version" \
            "docker-ce-cli=$docker_package_version" \
            "containerd.io=$containerd_package_version" \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libbpf-dev \
            libc6-dev-i386 \
            libc6-dev-arm64-cross
          test -f /usr/include/bpf/bpf_helpers.h
          test -f /usr/include/x86_64-linux-gnu/gnu/stubs-32.h
          command -v clang >/dev/null
          for tool in gcc g++ as ld objcopy; do
            command -v "aarch64-linux-gnu-$tool" >/dev/null
          done
          test -x "$(aarch64-linux-gnu-g++ -print-prog-name=cc1plus)"
          for header in \
            asm/sigcontext.h \
            asm/unistd.h \
            errno.h \
            linux/audit.h \
            linux/futex.h \
            linux/unistd.h \
            signal.h \
            stdint.h \
            stdlib.h \
            sys/prctl.h \
            sys/types.h \
            sys/ucontext.h \
            sys/user.h; do
            test -f "/usr/aarch64-linux-gnu/include/$header"
          done
          aarch64_gcc_include="$(aarch64-linux-gnu-gcc -print-file-name=include)"
          test -f "$aarch64_gcc_include/stdbool.h"
          test -f "$aarch64_gcc_include/stddef.h"
          test "$(docker version --format '{{.Server.Version}}')" = "$docker_engine_version"
          scripts/build-gvisor-runtime-bundle.sh "$RUNNER_TEMP/gvisor"
          sudo install -d -m 0755 /usr/libexec/heliopause/gvisor/gvisor-bin
          jq -er '.gvisor.runtime_bundle.members[].path' "$runtime_lock" | while IFS= read -r member; do
            sudo install -m 0755 "$RUNNER_TEMP/gvisor/$member" "/usr/libexec/heliopause/gvisor/$member"
          done
          sudo install -m 0644 "$RUNNER_TEMP/gvisor/gvisor-bundle.manifest.json" /usr/libexec/heliopause/gvisor/gvisor-bundle.manifest.json
          test "$(jq -er '.members | length' "$RUNNER_TEMP/gvisor/gvisor-bundle.manifest.json")" = 6
          while IFS=' ' read -r member sha512; do
            test "$(sudo sha512sum "/usr/libexec/heliopause/gvisor/$member" | awk '{print $1}')" = "$sha512"
          done <<EOF
          $(jq -er '.members[] | "\(.path) \(.sha512)"' "$RUNNER_TEMP/gvisor/gvisor-bundle.manifest.json")
          EOF
          sudo install -d -m 0700 -o "$USER" -g "$(id -gn)" /run/heliopause-observer
          sudo install -d -m 0755 /etc/heliopause
          sudo install -m 0600 tools/gvisor-observer/pod-init.json /etc/heliopause/pod-init.json
          sudo /usr/libexec/heliopause/gvisor/runsc install --download-sidecars=NEVER --require-sidecars=ALWAYS --runtime=runsc-trace -- --sidecar-usage-policy=STRICT --pod-init-config=/etc/heliopause/pod-init.json
          sudo python3 -c 'import json; from pathlib import Path; path = Path("/etc/docker/daemon.json"); config = json.loads(path.read_text()) if path.exists() else {}; config.update({"firewall-backend": "iptables", "iptables": True, "ip6tables": False}); path.write_text(json.dumps(config, sort_keys=True) + "\n")'
          sudo systemctl restart docker || { sudo systemctl status docker --no-pager || true; sudo journalctl -u docker --no-pager -n 100 || true; exit 1; }
          sudo iptables -S DOCKER-USER
          docker pull "$node_image"
          docker pull "$python_image"
          docker pull "$go_image"
          docker pull "$rust_image"
          docker pull "$uv_image"
          scripts/build-gvisor-observer-release.sh "$RUNNER_TEMP/haa_gvisor_observer"
          sudo install -m 0755 "$RUNNER_TEMP/haa_gvisor_observer" /usr/libexec/heliopause/haa_gvisor_observer

          source scripts/ci-integration-cleanup.sh
          haa_ci_initialize
          echo 'Building helox for gVisor integration'
          go build -trimpath -o "$RUNNER_TEMP/helox" ./cmd/helox
          echo 'Building network-policy helper for gVisor integration'
          go build -trimpath -o "$RUNNER_TEMP/haa-network-policy-helper" ./cmd/haa-network-policy-helper
          echo 'Installing network-policy helper and preparing its identity contract'
          sudo install -m 0755 "$RUNNER_TEMP/helox" /usr/libexec/heliopause/helox
          sudo install -m 0755 "$RUNNER_TEMP/haa-network-policy-helper" /usr/libexec/heliopause/haa-network-policy-helper
          sudo install -d -m 0755 -o root -g root /run/heliopause-network-policy
          printf '{"socket_path":"/run/heliopause-network-policy/helper.sock","client_path":"/usr/libexec/heliopause/helox","client_uid":%s,"client_gid":%s}\n' "$(id -u)" "$(id -g)" | sudo tee /etc/heliopause/network-policy.json >/dev/null
          # The ordinary client must read the root-owned, non-writable public
          # identity contract; it contains no credential or secret.
          sudo chmod 0644 /etc/heliopause/network-policy.json
          haa_start_policy_helper
          /usr/libexec/heliopause/gvisor/runsc --version
          docker version --format '{{.Server.Version}}'
          docker info --format '{{json (index .Runtimes "runsc-trace")}}'
          go test -run='^$' -fuzz=FuzzDecodeHelperRecord -fuzztime=2s ./internal/sandbox
          HELOX_HOSTTOOL_INTEGRATION=1 go test -v -timeout=2m ./internal/hosttool -run TestLinuxTrustedHostExecutorIntegration
          HELOX_UV_NATIVE_RUNTIME=1 go test -tags=realcorpus -v -timeout=3m ./internal/sandbox -run '^TestUVActualIsolated(NativeStartup|EmptyTargetQuery|NativeLockCollection)$'
          HELOX_GVISOR_INTEGRATION=1 go test -timeout=5m ./internal/sandbox -run TestLinuxGVisorLifecycleIntegration
          HELOX_GITHUB_RELEASE_INTEGRATION=1 go test -timeout=5m ./internal/sandbox -run TestLinuxGitHubReleaseELFDynamicIntegration
          # The typed-helper ordinary-user path is exercised for both npm and pip.
          # npm installs is-number@7.0.0 with complete ALLOW inspection and atomic
          # offline promotion (exit 0).
          # pip installs packaging@25.0 into an initialized Python 3.14 venv fixture,
          # proving complete ALLOW inspection and atomic offline promotion (exit 0).
          if [ "$HELOX_CI_CUDA_ONLY" = false ]; then
          mkdir -p "$RUNNER_TEMP/pypi-target"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/pypi-target:/target" \
            "$python_image" python -m venv --without-pip /target
          set +e
          /usr/libexec/heliopause/helox npm install is-number@7.0.0 --target "$RUNNER_TEMP/npm-target"
          npm_status=$?
          /usr/libexec/heliopause/helox pip install packaging@25.0 --target "$RUNNER_TEMP/pypi-target"
          pypi_status=$?
          set -e
          test "$npm_status" = 0
          test -f "$RUNNER_TEMP/npm-target/node_modules/is-number/package.json"
          jq -e '.name == "is-number" and .version == "7.0.0"' \
            "$RUNNER_TEMP/npm-target/node_modules/is-number/package.json" >/dev/null
          test "$pypi_status" = 0
          test -d "$RUNNER_TEMP/pypi-target/lib/python3.14/site-packages/packaging"
          HELOX_RUN_TERRAFORM_SOURCE_INTEGRATION=1 go test -v -timeout=3m ./internal/verification/terraformprovider -run '^TestPublicTerraformProviderSourceIntegration$'
          go test -c -tags=realcorpus -o "$RUNNER_TEMP/helox-sandbox-test" ./internal/sandbox
          haa_install_ci_client "$RUNNER_TEMP/helox-sandbox-test"
          haa_start_policy_helper
          bash scripts/ci-pnpm-runtime.sh
          go test -c -tags=realcorpus -o "$RUNNER_TEMP/helox-pnpm-project-test" ./internal/bootstrap
          haa_install_ci_client "$RUNNER_TEMP/helox-pnpm-project-test"
          haa_start_policy_helper
          bash scripts/ci-pnpm-runtime.sh project
          haa_install_ci_client "$RUNNER_TEMP/helox-sandbox-test"
          haa_start_policy_helper
          bash scripts/ci-bun-runtime.sh
          haa_install_ci_client "$RUNNER_TEMP/helox-pnpm-project-test"
          haa_start_policy_helper
          bash scripts/ci-bun-runtime.sh project
          haa_install_ci_client "$RUNNER_TEMP/helox-sandbox-test"
          haa_start_policy_helper
          HELOX_PYTORCH_RESOLVER_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.run '^TestLinuxPyTorchResolverIntegration$'
          (
            cd internal/sandbox
            HELOX_UV_PUBLIC_RESOLVER_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=10m -test.run '^TestUVPublicNativeResolverIntegration$'
          )
          bash scripts/ci-uv-tools.sh
          HELOX_UV_PUBLIC_UPDATE_RESOLVER_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=10m -test.run '^TestUVPublicNativeUpdateResolverIntegration$'
          haa_install_ci_client "$RUNNER_TEMP/helox-pnpm-project-test"
          haa_start_policy_helper
          bash scripts/ci-uv-tools.sh bootstrap
          haa_install_ci_client "$RUNNER_TEMP/helox-sandbox-test"
          haa_start_policy_helper
          HELOX_GO_RESOLVER_INTEGRATION=1 HELOX_GO_RESOLVER_PROJECT_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=5m -test.run '^TestLinuxGo(IsolatedResolver|IsolatedProjectResolver|SourceProjectSnapshot|DependencyFreeProjectSnapshot)Integration$'
          # A compiled test binary keeps the caller's cwd; match go test's package cwd.
          (
            cd internal/sandbox
            HELOX_CARGO_RESOLVER_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=5m -test.run '^TestLinuxCargoSourceProjectSnapshotIntegration$'
          )
          HELOX_TERRAFORM_PROVIDER_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=5m -test.run '^TestLinuxTerraformProvider(Probe|Security)Integration$'
          fi
          go test -c -o "$RUNNER_TEMP/helox-bootstrap-test" ./internal/bootstrap
          haa_install_ci_client "$RUNNER_TEMP/helox-bootstrap-test"
          haa_start_policy_helper
          if [ "$HELOX_CI_CUDA_ONLY" = false ]; then
          HELOX_NPM_INSPECT_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=5m -test.run '^TestLinuxNPMInspectCLIIntegration$'
          HELOX_UV_INSTALL_CLI_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=6m -test.run '^TestLinuxUVInstallCLIIntegration$'
          (
            cd internal/bootstrap
            HELOX_UV_SYNC_CLI_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=12m -test.failfast -test.run '^TestLinuxUVSync(Complete|Closure)CLIIntegration$'
          )
          HELOX_GO_RESOLVER_INTEGRATION=1 HELOX_GO_RESOLVER_PROJECT_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=10m -test.run '^TestLinuxGo(GetDownload|TransitiveGetDownload|DependencyFreeDownload)Integration$'
          HELOX_GO_BUILD_CLI_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=15m -test.run '^TestLinuxGo(DependencyFreeBuildCLI|PublicBuildCLI|TransitiveBuildCLI|InvalidTestdataBuildCLI|CgoBuildCLI|LibraryBuildCLI|MixedPackagesBuildCLI|MixedInvalidPackageBuildCLI|BuildSecurityCLI)Integration$'
          HELOX_CARGO_RESOLVER_INTEGRATION=1 HELOX_CARGO_ADD_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=10m -test.run '^TestLinuxCargo(Add|TransitiveAdd)Integration$'
          HELOX_CARGO_RESOLVER_INTEGRATION=1 HELOX_CARGO_BUILD_CLI_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=15m -test.run '^TestLinuxCargo.*Build.*CLIIntegration$|^TestLinuxCargoProcMacroSecurityCLIIntegration$'
          HELOX_TERRAFORM_INIT_INTEGRATION=1 /usr/libexec/heliopause/helox -test.v -test.timeout=10m -test.run '^TestLinuxTerraformInit(Integration|NegativeIntegration)$'
          fi
          selected_cuda_profiles=0
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pytorch_cu126_qualification }}" = true ]; then selected_cuda_profiles=$((selected_cuda_profiles + 1)); fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pytorch_cu130_qualification }}" = true ]; then selected_cuda_profiles=$((selected_cuda_profiles + 1)); fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.pytorch_cu132_qualification }}" = true ]; then selected_cuda_profiles=$((selected_cuda_profiles + 1)); fi
          if [ "$selected_cuda_profiles" -gt 1 ]; then
            echo "select at most one CUDA PyTorch qualification profile" >&2
            exit 1
          fi
          if [ "$selected_cuda_profiles" -gt 0 ]; then
            go run ./scripts/check qualification-freshness
