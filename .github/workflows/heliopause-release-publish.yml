name: Heliopause Verified Release Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable source tag to publish (for example v1.2.3)
        required: true
        type: string
      source_run_id:
        description: Successful Heliopause Release Build run that produced the candidate
        required: true
        type: string

permissions:
  contents: write
  attestations: read

concurrency:
  group: heliopause-release-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      GOTOOLCHAIN: local
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: Verify candidate identity and download immutable artifact
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          run_json="$(gh run view "$SOURCE_RUN_ID" -R "$GH_REPO" --json databaseId,workflowName,status,conclusion,event,headSha,headBranch)"
          test "$(jq -er '.workflowName' <<<"$run_json")" = 'Heliopause Release Build'
          test "$(jq -er '.status' <<<"$run_json")" = completed
          test "$(jq -er '.conclusion' <<<"$run_json")" = success
          test "$(jq -er '.event' <<<"$run_json")" = push
          source_sha="$(jq -er '.headSha' <<<"$run_json")"
          test "$source_sha" = "$tag_sha"
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          compare_status="$(gh api "repos/$GH_REPO/compare/$tag_sha...$main_sha" --jq '.status')"
          case "$compare_status" in
            ahead|identical) ;;
            *)
              echo "release tag commit is not in protected main history" >&2
              exit 1
              ;;
          esac
          required_count="$(
            gh api -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/commits/$tag_sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Required" and .status == "completed" and .conclusion == "success" and .app.slug == "github-actions")] | length'
          )"
          test "$required_count" -ge 1
          artifact_name="helox-${RELEASE_TAG}-${source_sha}"
          candidate="$RUNNER_TEMP/helox-release-candidate"
          mkdir -m 0700 "$candidate"
          gh run download "$SOURCE_RUN_ID" -R "$GH_REPO" -n "$artifact_name" -D "$candidate"
          expected_files=(
            haa_gvisor_observer-linux-amd64
            haa-network-policy-helper-linux-amd64
            helox-darwin-amd64
            helox-darwin-arm64
            helox-linux-amd64
            helox-linux-arm64
            helox-runtime-images.json
            helox-release-manifest.json
            helox-release-sbom.cdx.json
            helox-release-checksums.txt
          )
          test -z "$(find "$candidate" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(comm -3 <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) <(find "$candidate" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort))"
          test "$(jq -er '.version' "$candidate/helox-release-manifest.json")" = "$RELEASE_TAG"
          test "$(jq -er '.source_commit' "$candidate/helox-release-manifest.json")" = "$source_sha"
          test "$(jq -er '.workflow_run' "$candidate/helox-release-manifest.json")" = "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$SOURCE_RUN_ID"
          test "$(wc -l < "$candidate/helox-release-checksums.txt")" -eq 9
          (cd "$candidate" && sha256sum -c helox-release-checksums.txt)
      - name: Verify manifest asset bindings
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/helox-release-candidate"
          while IFS=$'\t' read -r name expected_sha expected_size; do
            test -f "$candidate/$name"
            actual_sha="$(sha256sum "$candidate/$name" | awk '{print $1}')"
            actual_size="$(stat -c '%s' "$candidate/$name")"
            test "$actual_sha" = "$expected_sha"
            test "$actual_size" = "$expected_size"
          done < <(jq -er '.assets[] | [.name, .sha256, (.size | tostring)] | @tsv' "$candidate/helox-release-manifest.json")
      - name: Verify GitHub artifact provenance
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/helox-release-candidate"
          signer="$GH_REPO/.github/workflows/heliopause-release-build.yml"
          expected_files=(
            haa_gvisor_observer-linux-amd64
            haa-network-policy-helper-linux-amd64
            helox-darwin-amd64
            helox-darwin-arm64
            helox-linux-amd64
            helox-linux-arm64
            helox-runtime-images.json
            helox-release-manifest.json
            helox-release-sbom.cdx.json
            helox-release-checksums.txt
          )
          for name in "${expected_files[@]}"; do
            test -f "$candidate/$name"
            gh attestation verify "$candidate/$name" \
              -R "$GH_REPO" \
              --signer-workflow "$signer" \
              --source-digest "$(jq -er '.source_commit' "$candidate/helox-release-manifest.json")" \
              --predicate-type 'https://slsa.dev/provenance/v1' \
              --deny-self-hosted-runners
          done
      - name: Re-run canonical release gate
        run: go run ./scripts/check release-gate
      - name: Refuse an existing release and create a draft
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/helox-release-candidate"
          release_probe="$RUNNER_TEMP/release-probe.txt"
          set +e
          gh api --include "repos/$GH_REPO/releases/tags/$RELEASE_TAG" >"$release_probe" 2>&1
          probe_status=$?
          set -e
          if test "$probe_status" -eq 0; then
            echo "release already exists; refusing overwrite" >&2
            exit 1
          fi
          grep -Eq '^HTTP/[0-9.]+ 404 ' "$release_probe" || {
            cat "$release_probe" >&2
            echo "release existence probe was unavailable; refusing publication" >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" \
            -R "$GH_REPO" \
            --verify-tag \
            --draft \
            --generate-notes \
            --latest=false \
            "$candidate/haa_gvisor_observer-linux-amd64" \
            "$candidate/haa-network-policy-helper-linux-amd64" \
            "$candidate/helox-darwin-amd64" \
            "$candidate/helox-darwin-arm64" \
            "$candidate/helox-linux-amd64" \
            "$candidate/helox-linux-arm64" \
            "$candidate/helox-runtime-images.json" \
            "$candidate/helox-release-manifest.json" \
            "$candidate/helox-release-sbom.cdx.json" \
            "$candidate/helox-release-checksums.txt"
      - name: Verify draft release asset bindings before publication
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/helox-release-candidate"
          expected_files=(
            haa_gvisor_observer-linux-amd64
            haa-network-policy-helper-linux-amd64
            helox-darwin-amd64
            helox-darwin-arm64
            helox-linux-amd64
            helox-linux-arm64
            helox-runtime-images.json
            helox-release-manifest.json
            helox-release-sbom.cdx.json
            helox-release-checksums.txt
          )
          release_json="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -er '.draft' <<<"$release_json")" = true
          test "$(jq -er '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -er '.assets | length' <<<"$release_json")" -eq 10
          test -z "$(comm -3 <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) <(jq -er '.assets[].name' <<<"$release_json" | LC_ALL=C sort))"
          for name in "${expected_files[@]}"; do
            expected_size="$(stat -c '%s' "$candidate/$name")"
            expected_digest="sha256:$(sha256sum "$candidate/$name" | awk '{print $1}')"
            asset_json="$(jq -ce --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release_json")"
            test "$(jq -er '.state' <<<"$asset_json")" = uploaded
            test "$(jq -er '.size' <<<"$asset_json")" = "$expected_size"
            test "$(jq -er '.digest' <<<"$asset_json")" = "$expected_digest"
          done
      - name: Publish and verify immutable release
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/helox-release-candidate"
          gh release edit "$RELEASE_TAG" -R "$GH_REPO" --draft=false
          expected_files=(
            haa_gvisor_observer-linux-amd64
            haa-network-policy-helper-linux-amd64
            helox-darwin-amd64
            helox-darwin-arm64
            helox-linux-amd64
            helox-linux-arm64
            helox-runtime-images.json
            helox-release-manifest.json
            helox-release-sbom.cdx.json
            helox-release-checksums.txt
          )
          status=0
          gh release verify "$RELEASE_TAG" -R "$GH_REPO" || status=1
          for name in "${expected_files[@]}"; do
            gh release verify-asset "$RELEASE_TAG" "$candidate/$name" -R "$GH_REPO" || status=1
          done
          if test "$status" -ne 0; then
            cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
            ## PUBLISHED_BUT_QUARANTINED

            Post-publish verification failed. Do not overwrite, delete, or re-tag this release.
            Quarantine this version, notify consumers not to use it, investigate the evidence, and publish a corrected new SemVer version.
            EOF
            exit 1
          fi
