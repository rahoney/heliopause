name: Heliopause Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  attestations: write
  id-token: write

defaults:
  run:
    working-directory: .

concurrency:
  group: heliopause-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    name: Build and attest release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Run canonical release gate
        run: go run ./scripts/check release-gate
      - name: Build deterministic native release assets
        run: |
          set -eu
          test "${GITHUB_REF_TYPE:-}" = tag
          dist="$RUNNER_TEMP/helox-release"
          mkdir -m 0700 "$dist"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o "$dist/helox-linux-amd64" ./cmd/helox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=true -o "$dist/helox-linux-arm64" ./cmd/helox
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -buildvcs=true -o "$dist/helox-darwin-amd64" ./cmd/helox
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -o "$dist/helox-darwin-arm64" ./cmd/helox
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o "$dist/haa-network-policy-helper-linux-amd64" ./cmd/haa-network-policy-helper
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o "$dist/haa-release-installer-linux-amd64" ./cmd/haa-release-installer
          scripts/build-gvisor-observer-release.sh "$dist/haa_gvisor_observer-linux-amd64"
          go run ./scripts/generate-runtime-lock.go -check
          pnpm_archive="$RUNNER_TEMP/helox-pnpm-linux-x64.tar.gz"
          pnpm_url="$(jq -er '.pnpm_tool.archive.url' scripts/runtimes.lock.json)"
          pnpm_size="$(jq -er '.pnpm_tool.archive.size' scripts/runtimes.lock.json)"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --max-filesize "$pnpm_size" --output "$pnpm_archive" "$pnpm_url"
          go run ./scripts/update-runtime materialize-pnpm \
            --root "$GITHUB_WORKSPACE" \
            --archive "$pnpm_archive" \
            --output "$dist/pnpm-linux-amd64" \
            --notices-output "$dist/pnpm-NOTICE.txt"
          rm -- "$pnpm_archive"
          bun_archive="$RUNNER_TEMP/helox-bun-linux-x64.zip"
          bun_url="$(jq -er '.bun_tool.archive.url' scripts/runtimes.lock.json)"
          bun_size="$(jq -er '.bun_tool.archive.size' scripts/runtimes.lock.json)"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --max-filesize "$bun_size" --output "$bun_archive" "$bun_url"
          go run ./scripts/update-runtime materialize-bun --root "$GITHUB_WORKSPACE" --archive "$bun_archive" --output "$dist/bun-linux-amd64" --notices-output "$dist/bun-NOTICE.txt"
          rm -- "$bun_archive"
          pipx_input="$RUNNER_TEMP/helox-pipx-supply"
          go run ./scripts/update-runtime fetch-pipx-supply --root "$GITHUB_WORKSPACE" --output "$pipx_input"
          go run ./scripts/update-runtime materialize-pipx --root "$GITHUB_WORKSPACE" --input "$pipx_input" --output "$dist/pipx-runtime-linux-amd64.zip" --notices-output "$dist/pipx-NOTICE.txt"
          go run ./scripts/runtime-image-manifest \
            --runtime-lock scripts/runtimes.lock.json \
            --output "$dist/helox-runtime-images.json"
          node_image="$(jq -er '.node_image.reference' scripts/runtimes.lock.json)"
          python_image="$(jq -er '.python_image.reference' scripts/runtimes.lock.json)"
          rust_image="$(jq -er '.rust_image.reference' scripts/runtimes.lock.json)"
          go_image="$(jq -er '.go_image.reference' scripts/runtimes.lock.json)"
          uv_image="$(jq -er '.uv_image.reference' scripts/runtimes.lock.json)"
          docker buildx imagetools inspect "$node_image" >/dev/null
          docker buildx imagetools inspect "$python_image" >/dev/null
          docker buildx imagetools inspect "$rust_image" >/dev/null
          docker buildx imagetools inspect "$go_image" >/dev/null
          docker buildx imagetools inspect "$uv_image" >/dev/null
          go run ./scripts/release-packages \
            --version "$GITHUB_REF_NAME" \
            --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")" \
            --assets-dir "$dist" \
            --output-dir "$dist" \
            --runtime-lock scripts/runtimes.lock.json \
            --license LICENSE
          go run ./scripts/release-manifest \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --runtime-lock scripts/runtimes.lock.json \
            --sbom-output "$dist/helox-release-sbom.cdx.json" \
            --runtime-images "$dist/helox-runtime-images.json" \
            --output "$dist/helox-release-manifest.json" \
            --checksums-output "$dist/helox-release-checksums.txt" \
            --asset "$dist/helox-linux-amd64" \
            --asset "$dist/helox-linux-arm64" \
            --asset "$dist/helox-darwin-amd64" \
            --asset "$dist/helox-darwin-arm64" \
            --asset "$dist/haa_gvisor_observer-linux-amd64" \
            --asset "$dist/haa-network-policy-helper-linux-amd64" \
            --asset "$dist/haa-release-installer-linux-amd64" \
            --asset "$dist/pnpm-linux-amd64" \
            --asset "$dist/pnpm-NOTICE.txt" \
            --asset "$dist/bun-linux-amd64" \
            --asset "$dist/bun-NOTICE.txt" \
            --asset "$dist/pipx-runtime-linux-amd64.zip" \
            --asset "$dist/pipx-NOTICE.txt" \
            --asset "$dist/helox-linux-amd64.deb" \
            --asset "$dist/helox-linux-amd64.rpm"
      - name: Attest release candidate provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: '${{ runner.temp }}/helox-release/*'
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helox-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/helox-release
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
