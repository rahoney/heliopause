[tool]
requirements = [{ name = "haa-tool-fixture", specifier = ">=1,<2" }]
python = "/usr/local/bin/python"
entrypoints = [
    { name = "haa-alt", install-path = "/work/uv-bin/haa-alt", from = "haa-tool-fixture" },
    { name = "haa-demo", install-path = "/work/uv-bin/haa-demo", from = "haa-tool-fixture" },
]

[tool.options]
index-url = "https://pypi.org/simple/"
no-index = true
find-links = ["file:///opt/haa-query/wheels-v1"]
link-mode = "copy"
no-sources = true
no-build = true
