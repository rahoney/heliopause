[project]
name='haa-option-data'
version='0.1.0'
requires-python='>=3.10,<3.15'
dependencies=["idna>=3.10; python_version >= '3.12'", "idna<3.9; python_version < '3.12'", "requests[socks]==2.32.5; sys_platform == 'linux'"]
[project.optional-dependencies]
net=["packaging==25.0"]
[dependency-groups]
dev=["six==1.17.0", {include-group='lint'}]
lint=["typing-extensions==4.15.0"]
[tool.uv]
package=false
default-groups=['lint']
